name: Build and Release SA:RP Linggo Next

on:
  push:
    branches: [ main, master ]
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate Release Tag and Date
        id: vars
        shell: bash
        run: |
          BUILD_DATE=$(date +'%Y%m%d')
          echo "tag=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "title=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "filename=SARP-Linggo-Next-${BUILD_DATE}.exe" >> $GITHUB_OUTPUT

      - name: Build Standalone OneFile Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "SARP-Linggo-Next-${{ steps.vars.outputs.tag }}" --collect-all PyQt6 --hidden-import=sounddevice --hidden-import=_sounddevice --hidden-import=numpy --hidden-import=requests --hidden-import=keyboard --hidden-import=pyperclip main.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARP-Linggo-Next-${{ steps.vars.outputs.tag }}
          path: dist/SARP-Linggo-Next-${{ steps.vars.outputs.tag }}.exe

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.title }}
          files: dist/SARP-Linggo-Next-${{ steps.vars.outputs.tag }}.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
